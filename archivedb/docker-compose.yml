# ArchiveDB docker-compose.yml
#
# VERSION HISTORY
#   1.0  2026-11-01  Portable edition: all settings come from the .env file
#                    (template: .env.example), no fixed paths or addresses
#                    in the compose file any more.

services:
  archivedb:
    build: .
    container_name: archivedb
    restart: unless-stopped
    ports:
      - "${ARCHIVEDB_PORT:-8000}:8000"
    environment:
      # Folder names below the archive root (see volume below)
      - SRR_FOLDER=${SRR_FOLDER:-scenereleases_srr}
      - NOSRR_FOLDER=${NOSRR_FOLDER:-scenereleases_nosrr}
      # Optional: "Open in Storagebox" link on the detail page. Empty = no button.
      - FILES_BASE_URL=${FILES_BASE_URL:-}
      - FILES_FOLDER=${FILES_FOLDER:-scenereleases_srr}
      - FILES_FOLDER_NOSRR=${FILES_FOLDER_NOSRR:-scenereleases_nosrr}
      # Optional: Windows share for "Open in Explorer". Empty = no button.
      - UNC_BASE_PATH=${UNC_BASE_PATH:-}
    volumes:
      # Your archive root (contains scenereleases_srr and
      # scenereleases_nosrr), read only.
      - ${ARCHIVE_PATH:?set ARCHIVE_PATH in .env}:/archive:ro
      # The SQLite database survives restarts and rebuilds.
      - archivedb_data:/data

volumes:
  archivedb_data:
