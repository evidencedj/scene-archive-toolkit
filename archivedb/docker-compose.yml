# ArchiveDB docker-compose.yml
#
# VERSIONSHISTORIE
#   1.0  2026-11-01  Portable Edition: alle Einstellungen kommen aus der Datei
#                    .env (Vorlage: .env.example), keine festen Pfade oder
#                    Adressen mehr im Compose File.

services:
  archivedb:
    build: .
    container_name: archivedb
    restart: unless-stopped
    ports:
      - "${ARCHIVEDB_PORT:-8000}:8000"
    environment:
      # Ordnernamen unter dem Archiv Wurzelordner (siehe Volume unten)
      - SRR_FOLDER=${SRR_FOLDER:-scenereleases_srr}
      - NOSRR_FOLDER=${NOSRR_FOLDER:-scenereleases_nosrr}
      # Optional: Link "Open in Storagebox" auf der Detailseite. Leer = kein Button.
      - FILES_BASE_URL=${FILES_BASE_URL:-}
      - FILES_FOLDER=${FILES_FOLDER:-scenereleases_srr}
      - FILES_FOLDER_NOSRR=${FILES_FOLDER_NOSRR:-scenereleases_nosrr}
      # Optional: Windows Freigabe fuer "Open in Explorer". Leer = kein Button.
      - UNC_BASE_PATH=${UNC_BASE_PATH:-}
    volumes:
      # Dein Archiv Wurzelordner (enthaelt scenereleases_srr und
      # scenereleases_nosrr), nur lesend.
      - ${ARCHIVE_PATH:?ARCHIVE_PATH in .env setzen}:/archive:ro
      # Die SQLite Datenbank bleibt ueber Neustarts und Rebuilds erhalten.
      - archivedb_data:/data

volumes:
  archivedb_data:
