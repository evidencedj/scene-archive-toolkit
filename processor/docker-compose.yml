# Incoming Processor docker-compose.yml
#
# VERSION HISTORY
#   1.0  2026-11-01  First version for the toolkit. Settings come from the
#                    .env file (template: .env.example).
#   1.1  2026-11-01  Build context is the toolkit root (image contains tools/).
#                    New folder STATE_PATH for the genre cache of the statistics.
#
# One run:         docker compose run --rm processor
# Preview only:    docker compose run --rm processor python incoming_processor.py --dry-run

services:
  processor:
    build:
      context: ..
      dockerfile: processor/Dockerfile
    image: scene-processor:local
    container_name: scene-processor
    # Not a long running service: the container starts per run and exits by itself.
    restart: "no"
    environment:
      - DRY_RUN=${DRY_RUN:-0}
      - REQUEST_DELAY=${REQUEST_DELAY:-1.0}
      - VPN_PROXY_URL=${VPN_PROXY_URL:-}
      - ARCHIVEDB_URL=${ARCHIVEDB_URL:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - DISCORD_SKIP_EMPTY_RUNS=${DISCORD_SKIP_EMPTY_RUNS:-1}
    volumes:
      # Your archive root, mounted LOCALLY (symlinks do not work over SMB).
      - ${ARCHIVE_PATH:?set ARCHIVE_PATH in .env}:/archive
      # Logs of every run
      - ${LOG_PATH:-./logs}:/app/logs
      # Genre statistics cache (kept between runs)
      - ${STATE_PATH:-./state}:/app/state
